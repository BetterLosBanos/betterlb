name: Build and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Create GitHub Deployment
        if: github.event_name == 'push'
        uses: actions/create-deployment@v1
        id: create_deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          auto-inactive: true

      - name: Create GitHub Deployment (PR)
        if: github.event_name == 'pull_request'
        uses: actions/create-deployment@v1
        id: create_pr_deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: preview
          auto-inactive: true

      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Merge Service Data
        run: python3 scripts/merge_services.py

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f # v3.9.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=betterlb
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark GitHub Deployment as Successful
        if: steps.create_deployment.outputs.deployment_id || steps.create_pr_deployment.outputs.deployment_id
        uses: actions/write-deployment-status@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.create_deployment.outputs.deployment_id || steps.create_pr_deployment.outputs.deployment_id }}
          state: success
          environment_url: https://betterlb.pages.dev
